# 개인 서버에서: cp .env.example .env 로 값을 채운 뒤
#   docker compose up -d --build
# 업데이트:  git pull && docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      OWNER_KEY: ${OWNER_KEY:?OWNER_KEY를 .env에 넣어 주세요}
      SITE_TITLE: ${SITE_TITLE:-시호와 약속 잡기}
      SEED_DEMO: ${SEED_DEMO:-}
      BOOKING_UNTIL: ${BOOKING_UNTIL:-}
    volumes:
      - meet-data:/data
    # 서버 안에서만 확인용으로 열어 둠 (바깥 인터넷에는 열리지 않음)
    ports:
      - "127.0.0.1:3000:3000"

  # 터널 설정은 scripts/tunnel-setup.sh 가 cloudflared/ 에 만든다 (Zero Trust 대시보드 불필요)
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  meet-data:
